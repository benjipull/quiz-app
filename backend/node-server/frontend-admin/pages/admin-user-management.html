<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player Management</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: radial-gradient(circle at top left, #111 0%, #000 100%);
      color: #eee;
      margin: 0;
      padding: 2rem;
      min-height: 100vh;
    }

    .container {
      width: min(100%, 1720px);
      max-width: none;
      margin: 0 auto;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: #5ea6ff;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    h1 {
      font-size: 2rem;
      margin: 0 0 1rem 0;
      color: #5ea6ff;
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 0 0 0.9rem 0;
      padding: 0.7rem 0.9rem;
      border: 1px solid #2f2f2f;
      border-radius: 10px;
      background: #121212;
      width: fit-content;
    }

    .filters h2 {
      margin: 0 0.4rem 0 0;
      font-size: 0.95rem;
      color: #bcd8ff;
      font-weight: 600;
    }

    .filter-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.9rem;
      color: #ddd;
    }

    .filter-item input {
      accent-color: #5ea6ff;
      cursor: pointer;
    }

    .filter-item label {
      cursor: pointer;
    }

    #playersStatus {
      margin: 0 0 0.9rem 0;
      color: #c8c8c8;
      font-size: 0.95rem;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #2f2f2f;
      border-radius: 10px;
      background: #111;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 0;
      table-layout: fixed;
    }

    thead {
      background: #202020;
    }

    th,
    td {
      padding: 0.65rem 0.55rem;
      text-align: left;
      border-bottom: 1px solid #262626;
      font-size: 0.84rem;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    th {
      color: #bcd8ff;
      letter-spacing: 0.01em;
    }

    th.sortable {
      position: relative;
      padding-right: 1.35rem;
      cursor: pointer;
      user-select: none;
    }

    th.sortable::after {
      content: attr(data-sort-indicator);
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.7rem;
      color: #8fbaff;
      opacity: 0.85;
    }

    th.sortable:hover {
      color: #d8e9ff;
    }

    tbody tr:hover {
      background: #181818;
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .muted {
      color: #9a9a9a;
    }

    .action-btn {
      background: #6f3ff5;
      color: #fff;
      border: 1px solid #835cff;
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .action-btn:hover {
      background: #7f56ff;
    }

    .action-btn:active {
      transform: translateY(1px);
    }

    .action-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="/admin/pages/admin-cms.html" class="back-link">&larr; Back to CMS</a>
    <h1>Player Management</h1>

    <section class="filters">
      <h2>Filters</h2>
      <div class="filter-item">
        <input type="checkbox" id="hideZeroKnowledge" checked />
        <label for="hideZeroKnowledge">Hide players with 0 knowledge points</label>
      </div>
    </section>

    <p id="playersStatus">Loading players...</p>

    <div class="table-wrap">
      <table id="playersTable" style="display: none;">
        <thead>
          <tr>
            <th class="sortable" data-sort-key="alias">Alias</th>
            <th class="sortable" data-sort-key="playerType">Player Type</th>
            <th class="num sortable" data-sort-key="level">Level</th>
            <th class="num sortable" data-sort-key="knowledgePoints">Knowledge Points</th>
            <th class="num sortable" data-sort-key="quizzesCompleted">Quizzes Completed</th>
            <th class="num sortable" data-sort-key="coins">Coins</th>
            <th class="sortable" data-sort-key="lastLogin">Last Login</th>
            <th class="sortable" data-sort-key="createdAt">Created At</th>
            <th class="num sortable" data-sort-key="retentionDays">Retention Days</th>
            <th class="sortable" data-sort-key="actions">Actions</th>
          </tr>
        </thead>
        <tbody id="playersTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("token");
    const userType = (localStorage.getItem("userType") || "").toLowerCase();

    if (!token || userType !== "admin") {
      window.location.href = "/admin/pages/admin-login.html";
    }

    const playersStatus = document.getElementById("playersStatus");
    const playersTable = document.getElementById("playersTable");
    const playersTableBody = document.getElementById("playersTableBody");
    const hideZeroKnowledgeCheckbox = document.getElementById("hideZeroKnowledge");
    const sortableHeaders = Array.from(
      document.querySelectorAll("#playersTable thead th[data-sort-key]")
    );
    let allPlayers = [];
    let sortState = { key: "lastLogin", direction: "desc" };

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatLastLogin(value) {
      if (!value) return '<span class="muted">Never</span>';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '<span class="muted">Unknown</span>';
      return escapeHtml(date.toLocaleString());
    }

    function formatCreatedAt(value) {
      if (!value) return '<span class="muted">Unknown</span>';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '<span class="muted">Unknown</span>';
      return escapeHtml(date.toLocaleString());
    }

    function toSortableTime(value) {
      if (!value) return 0;
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? 0 : date.getTime();
    }

    function getRetentionDaysNumber(createdAtValue, lastLoginValue) {
      if (!createdAtValue || !lastLoginValue) return null;

      const createdDate = new Date(createdAtValue);
      const lastLoginDate = new Date(lastLoginValue);
      if (Number.isNaN(createdDate.getTime()) || Number.isNaN(lastLoginDate.getTime())) {
        return null;
      }

      const createdAtUtcDateOnly = Date.UTC(
        createdDate.getUTCFullYear(),
        createdDate.getUTCMonth(),
        createdDate.getUTCDate()
      );
      const lastLoginUtcDateOnly = Date.UTC(
        lastLoginDate.getUTCFullYear(),
        lastLoginDate.getUTCMonth(),
        lastLoginDate.getUTCDate()
      );

      const msPerDay = 24 * 60 * 60 * 1000;
      const retentionDays = Math.floor((lastLoginUtcDateOnly - createdAtUtcDateOnly) / msPerDay);
      return Math.max(0, retentionDays);
    }

    function formatRetentionDays(createdAtValue, lastLoginValue) {
      const retentionDays = getRetentionDaysNumber(createdAtValue, lastLoginValue);
      if (retentionDays === null) return '<span class="muted">-</span>';
      return retentionDays.toLocaleString();
    }

    function getSortableValue(player, key) {
      switch (key) {
        case "alias":
          return player.alias ? String(player.alias).trim().toLowerCase() : null;
        case "playerType":
          return player.userType ? String(player.userType).trim().toLowerCase() : "registered";
        case "level": {
          const value = Number(player.level);
          return Number.isFinite(value) ? value : null;
        }
        case "knowledgePoints":
          return Number(player.knowledgePoints ?? 0);
        case "quizzesCompleted":
          return Number(player.quizzesCompleted ?? 0);
        case "coins":
          return Number(player.coins ?? 0);
        case "lastLogin":
          return toSortableTime(player.lastlogin_at) || null;
        case "createdAt":
          return toSortableTime(player.created_at) || null;
        case "retentionDays":
          return getRetentionDaysNumber(player.created_at, player.lastlogin_at);
        case "actions":
          return player.alias ? String(player.alias).trim().toLowerCase() : null;
        default:
          return null;
      }
    }

    function compareByAliasThenId(a, b) {
      const aliasA = a.alias ? String(a.alias).toLowerCase() : "";
      const aliasB = b.alias ? String(b.alias).toLowerCase() : "";
      const aliasCompare = aliasA.localeCompare(aliasB, undefined, {
        numeric: true,
        sensitivity: "base",
      });
      if (aliasCompare !== 0) return aliasCompare;

      const idA = a._id ? String(a._id) : "";
      const idB = b._id ? String(b._id) : "";
      return idA.localeCompare(idB, undefined, { numeric: true, sensitivity: "base" });
    }

    function comparePlayers(a, b) {
      const aValue = getSortableValue(a, sortState.key);
      const bValue = getSortableValue(b, sortState.key);
      const aMissing = aValue === null || aValue === undefined || aValue === "";
      const bMissing = bValue === null || bValue === undefined || bValue === "";

      if (aMissing && bMissing) return compareByAliasThenId(a, b);
      if (aMissing) return 1;
      if (bMissing) return -1;

      let result = 0;
      if (typeof aValue === "number" && typeof bValue === "number") {
        result = aValue - bValue;
      } else {
        result = String(aValue).localeCompare(String(bValue), undefined, {
          numeric: true,
          sensitivity: "base",
        });
      }

      if (result === 0) return compareByAliasThenId(a, b);
      return sortState.direction === "asc" ? result : -result;
    }

    function updateSortHeaderIndicators() {
      sortableHeaders.forEach((header) => {
        const headerSortKey = header.getAttribute("data-sort-key");
        const isActive = headerSortKey === sortState.key;
        const ariaSort = isActive
          ? sortState.direction === "asc"
            ? "ascending"
            : "descending"
          : "none";
        const indicator = isActive
          ? sortState.direction === "asc"
            ? "▲"
            : "▼"
          : "↕";

        header.setAttribute("aria-sort", ariaSort);
        header.setAttribute("data-sort-indicator", indicator);
      });
    }

    function renderPlayers() {
      if (!Array.isArray(allPlayers) || allPlayers.length === 0) {
        playersStatus.textContent = "No players found.";
        playersTable.style.display = "none";
        return;
      }

      const hideZeroKnowledge = Boolean(hideZeroKnowledgeCheckbox?.checked);
      const filteredPlayers = allPlayers.filter((player) => {
        if (!hideZeroKnowledge) return true;
        return Number(player.knowledgePoints ?? 0) > 0;
      });

      if (filteredPlayers.length === 0) {
        playersStatus.textContent = "No players match the current filters.";
        playersTable.style.display = "none";
        return;
      }

      const sortedPlayers = [...filteredPlayers].sort(comparePlayers);

      playersTableBody.innerHTML = sortedPlayers
        .map((player) => {
          const aliasValue = player.alias ? escapeHtml(player.alias) : '<span class="muted">Unknown</span>';
          const aliasPlain = player.alias ? String(player.alias) : "Unknown";
          const aliasForAttr = encodeURIComponent(aliasPlain);
          const playerType = player.userType ? escapeHtml(player.userType) : '<span class="muted">Registered</span>';
          const knowledgePoints = Number(player.knowledgePoints ?? 0);
          const parsedLevel = Number(player.level);
          const levelDisplay = Number.isFinite(parsedLevel)
            ? parsedLevel.toLocaleString()
            : '<span class="muted">Unknown</span>';
          const quizzesCompleted = Number(player.quizzesCompleted ?? 0);
          const coins = Number(player.coins ?? 0);
          return `
            <tr>
              <td>${aliasValue}</td>
              <td>${playerType}</td>
              <td class="num">${levelDisplay}</td>
              <td class="num">${knowledgePoints.toLocaleString()}</td>
              <td class="num">${quizzesCompleted.toLocaleString()}</td>
              <td class="num">${coins.toLocaleString()}</td>
              <td>${formatLastLogin(player.lastlogin_at)}</td>
              <td>${formatCreatedAt(player.created_at)}</td>
              <td class="num">${formatRetentionDays(player.created_at, player.lastlogin_at)}</td>
              <td>
                <button
                  type="button"
                  class="action-btn reset-progress-btn"
                  data-player-id="${player._id}"
                  data-player-alias="${aliasForAttr}"
                >
                  Reset Progress
                </button>
              </td>
            </tr>
          `;
        })
        .join("");

      playersStatus.textContent = `${filteredPlayers.length} of ${allPlayers.length} player(s) shown.`;
      playersTable.style.display = "table";
      updateSortHeaderIndicators();
    }

    async function resetPlayerProgress(playerId, alias) {
      if (!playerId) return;

      const playerAlias = alias || "this player";
      const confirmed = window.confirm(
        `Reset progress for ${playerAlias}? This will set level to 1, knowledge points to 0, and delete all saga progression for this player.`
      );

      if (!confirmed) return;

      try {
        const response = await fetch(`/api/admin/players/${encodeURIComponent(playerId)}/reset-progress`, {
          method: "PATCH",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem("token");
          localStorage.removeItem("alias");
          localStorage.removeItem("userType");
          window.location.href = "/admin/pages/admin-login.html";
          return;
        }

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(payload?.error || payload?.message || "Failed to reset player progress");
        }

        await loadPlayers();
        alert(`Progress reset for ${playerAlias}, and saga progression was deleted.`);
      } catch (error) {
        alert(`Error resetting progress: ${error.message}`);
      }
    }

    async function loadPlayers() {
      try {
        const response = await fetch("/api/admin/players", {
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem("token");
          localStorage.removeItem("alias");
          localStorage.removeItem("userType");
          window.location.href = "/admin/pages/admin-login.html";
          return;
        }

        const players = await response.json();

        if (!response.ok) {
          throw new Error(players?.error || players?.message || "Failed to load players");
        }

        allPlayers = Array.isArray(players) ? [...players] : [];
        renderPlayers();
      } catch (error) {
        playersStatus.textContent = `Error loading players: ${error.message}`;
        playersTable.style.display = "none";
      }
    }

    hideZeroKnowledgeCheckbox.addEventListener("change", renderPlayers);
    sortableHeaders.forEach((header) => {
      header.addEventListener("click", () => {
        const headerSortKey = header.getAttribute("data-sort-key");
        if (!headerSortKey) return;

        if (sortState.key === headerSortKey) {
          sortState.direction = sortState.direction === "asc" ? "desc" : "asc";
        } else {
          sortState = { key: headerSortKey, direction: "asc" };
        }

        renderPlayers();
      });
    });
    updateSortHeaderIndicators();
    playersTableBody.addEventListener("click", (event) => {
      const target = event.target instanceof Element ? event.target : null;
      const resetButton = target ? target.closest(".reset-progress-btn") : null;
      if (!resetButton) return;

      const playerId = resetButton.getAttribute("data-player-id");
      const playerAliasRaw = resetButton.getAttribute("data-player-alias");
      const playerAlias = playerAliasRaw ? decodeURIComponent(playerAliasRaw) : "this player";
      resetPlayerProgress(playerId, playerAlias);
    });
    loadPlayers();
  </script>
</body>
</html>
