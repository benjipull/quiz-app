<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quizicle Admin Login</title>
  <style>
    /* ==== GLOBAL STYLE ==== */
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(circle at top left, #0b0b0b 0%, #000 100%);
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      position: relative;
    }

    /* ==== WATERMARK LOGO ==== */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: url("../images/Quizzcle Logo.PNG") center/45% no-repeat;
      opacity: 0.05;
      filter: blur(1px);
      z-index: 0;
    }

    /* ==== MAGICAL SNOW PARTICLES ==== */
    .snowflake {
      position: absolute;
      top: -10px;
      color: #5ea6ff;
      opacity: 0.7;
      font-size: 10px;
      user-select: none;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      filter: drop-shadow(0 0 6px rgba(94, 166, 255, 0.8));
      z-index: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }

      100% {
        transform: translateY(100vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* ==== LOGIN CARD ==== */
    .login-box {
      position: relative;
      z-index: 1;
      background: rgba(25, 25, 25, 0.9);
      backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      width: 340px;
      box-shadow: 0 0 20px rgba(94, 166, 255, 0.3);
      border: 1px solid rgba(94, 166, 255, 0.2);
      text-align: center;
      animation: fadeIn 1.2s ease;
    }

    /* ==== TITLE ==== */
    .login-box h1 {
      font-size: 1.6rem;
      margin-bottom: 1.8rem;
      color: #5ea6ff;
      text-shadow: 0 0 12px rgba(94, 166, 255, 0.6);
      letter-spacing: 0.05em;
    }

    /* ==== FORM WRAPPER ==== */
    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    /* ==== INPUT + BUTTON UNIFIED WIDTH ==== */
    input,
    button {
      width: 90%;
      max-width: 260px;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    /* ==== INPUT FIELDS ==== */
    input {
      padding: 0.7rem;
      border: 1px solid #333;
      background: #141414;
      color: #fff;
    }

    input:focus {
      outline: none;
      border-color: #5ea6ff;
      box-shadow: 0 0 8px rgba(94, 166, 255, 0.4);
    }

    /* ==== BUTTON ==== */
    button {
      width: 90%;
      max-width: 260px;
      padding: 0.8rem;
      background: linear-gradient(135deg, #5ea6ff, #1e75ff);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      letter-spacing: 0.03em;
      transition: background 0.3s ease, transform 0.2s ease;
      box-shadow: 0 0 10px rgba(94, 166, 255, 0.3);
      margin-top: 2.4rem;
    }

    button:hover {
      background: linear-gradient(135deg, #7eb8ff, #2a82ff);
      transform: translateY(-2px);
      box-shadow: 0 0 15px rgba(94, 166, 255, 0.6);
    }

    /* ==== FRIENDLY MESSAGE ==== */
    .info-message {
      margin-top: 2rem;
      color: #bbb;
      font-size: 0.85rem;
      line-height: 1.4;
      padding: 0 1rem;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.15);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 1.2rem;
    }

    .info-message a {
      color: #5ea6ff;
      text-decoration: none;
      font-weight: 500;
    }

    .info-message a:hover {
      text-decoration: underline;
    }

    /* ==== ERROR MESSAGE ==== */
    .error {
      color: #ff5a5a;
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.9rem;
      min-height: 1.2rem;
    }

    /* ==== FOOTER ==== */
    footer {
      position: absolute;
      bottom: 1rem;
      color: #777;
      font-size: 0.8rem;
      letter-spacing: 0.03em;
      z-index: 1;
    }

    /* ==== ANIMATIONS ==== */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <!-- ❄️ Snow effect container -->
  <div id="snow-container"></div>

  <div class="login-box">
    <h1>Admin Login</h1>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Login</button>
      <div id="error" class="error"></div>
    </form>

    <div class="info-message">
      You need to be part of the <strong>Quizicle team</strong> to access the admin portal.<br />
      If you’d like to help contribute or collaborate, please feel free to
      <a href="mailto:info@quizicle.app">reach out to us</a> — we’d love to hear from you!
    </div>
  </div>

  <footer>© 2025 Quizicle Admin Portal</footer>

  <script>
    /* === Snowfall Effect === */
    const snowContainer = document.getElementById('snow-container');
    const numFlakes = 40; // adjust for more or fewer sparkles

    for (let i = 0; i < numFlakes; i++) {
      const flake = document.createElement('div');
      flake.classList.add('snowflake');
      flake.textContent = '✦';
      flake.style.left = Math.random() * 100 + 'vw';
      flake.style.fontSize = 8 + Math.random() * 10 + 'px';
      flake.style.animationDuration = 5 + Math.random() * 10 + 's';
      flake.style.animationDelay = Math.random() * 10 + 's';
      snowContainer.appendChild(flake);
    }

    /* === Login Logic === */
    const form = document.getElementById("loginForm");
    const errorDiv = document.getElementById("error");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorDiv.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Login failed");

        localStorage.setItem("token", data.token);
        localStorage.setItem("alias", data.user.alias);
        localStorage.setItem("userType", data.user.userType);

        if ((data.user.userType || "").toLowerCase() !== "admin") {
          throw new Error("Access denied: You are not an admin.");
        }

        window.location.href = "/admin/pages/admin-landing.html";
      } catch (err) {
        errorDiv.textContent = err.message;
      }
    });
  </script>
</body>

</html>
