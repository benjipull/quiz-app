<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="stylesheet" href="styles/categories.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="styles/questions.css">
    <link rel="stylesheet" href="styles/avatar.css">
    <link rel="stylesheet" href="styles/logo.css">
    <link rel="stylesheet" href="styles/results.css">
    <link rel="stylesheet" href="styles/userdetails.css">
</head>

<header id="logo-container">
    <img id="quizicle-logo" src="images/QuizicleLogo.png" alt="Quizicle Logo">
</header>

<body>
    <main>
        <!-- User Profile Section -->
        <div id="user-profile" class="hidden">
            <div id="avatar-container">
                <img id="user-avatar" src="" alt="User Avatar">
            </div>
            <p id="user-alias">Username</p>
        </div>

        <!-- Back Button -->
        <button id="back-button" class="back-btn hidden">
            <i class="fas fa-arrow-left"></i>
        </button>

        <!-- Authentication Section (Visible when NOT logged in) -->
        <div id="auth-section" class="hidden">
            <!-- 🚀 Login Section -->
            <div class="login-section">
                <h2>Login</h2>
                <input type="email" id="login-email" placeholder="Email">
                <input type="password" id="login-password" placeholder="Password">
                <button id="submit-login" class="btn login-btn">Login</button>
                <button id="forgot-password-btn" class="forgot-password-btn">Forgot Password?</button>
            </div>

            <!-- 🚀 Sign Up Section -->
            <div class="signup-section">
                <h2>Sign Up</h2>
                <input type="text" id="signup-alias" placeholder="Alias">
                <input type="email" id="signup-email" placeholder="Email">
                <input type="password" id="signup-password" placeholder="Password">
                <input type="number" id="signup-age" placeholder="Age">
                <button id="submit-signup" class="btn signup-btn">Sign Up</button>
            </div>
        </div>

        <div id="reset-message" class="hidden">

        </div>

        <div id="quiz-container">
            <!-- Category Selection -->
            <div id="category-container">
                <div id="category-buttons" class="category-grid">
                    <!-- ✅ Create Category Card -->
                    <div id="create-category-card" class="category-button create-category-card">
                        <span>+ Create a new Category</span>
                    </div>
                </div>
            </div>

            <div id="question-container" class="hidden">

                <!-- Progress Bar -->
                <div id="progress-bar-container" class="hidden">
                    <p id="progress-text">Question 1 of 10</p>
                    <div class="progress-wrapper">
                        <div id="progress-bar"></div>
                    </div>
                </div>

                <h2 id="category-label"> <span id="selected-category-label"></span></h2>
                <p id="question" class="hidden"></p>
                <div id="options-container"></div>
                <p id="explanation" class="hidden"></p>

                <!-- ✅ Thumbs Up and Down Buttons -->
                <div id="thumbs-container">
                    <button id="thumbs-up" class="thumb-button"><i class="fas fa-thumbs-up"></i></button>
                    <button id="thumbs-down" class="thumb-button"><i class="fas fa-thumbs-down"></i></button>
                </div>

                <button id="next-question-button" class="hidden standard-button">Next Question</button>
                <button id="show-results-button" class="hidden standard-button">Finish</button>
            </div>

            <!-- Results Container (For Quiz Completion) -->
            <div id="results-container" class="hidden">
                <h2>🎉 Quiz Completed! 🎉</h2>
                <p id="quiz-results"></p>

                <!-- ✅ Star Rating System -->
                <div id="rating-container" class="hidden">
                    <span class="star" data-value="1">&#9733;</span>
                    <span class="star" data-value="2">&#9733;</span>
                    <span class="star" data-value="3">&#9733;</span>
                    <span class="star" data-value="4">&#9733;</span>
                    <span class="star" data-value="5">&#9733;</span>
                </div>

                <button id="restart-quiz" class="standard-button">Back to Categories</button>
            </div>
        </div>

        <!-- User Details Container (Initially Hidden) -->
        <div id="user-details-container" class="hidden">
            <h2>User Details</h2>

            <!-- Avatar Selection -->
            <div id="avatar-selection-container">
                <h3>Select an Avatar</h3>
                <div id="avatar-grid">
                    <!-- Avatars will be dynamically added here -->
                </div>
            </div>

            <form id="user-details-form">
                <label for="user-details-alias">Alias</label>
                <input type="text" id="user-details-alias">

                <label for="user-details-email">Email</label>
                <input type="email" id="user-details-email" disabled>

                <label for="user-details-age">Age</label>
                <input type="number" id="user-details-age">

                <button id="user-details-save" type="button" class="btn">Save</button>
            </form>
        </div>


        <!-- ✅ Notifications -->
        <div id="notification-container"></div>
    </main>

    <!-- Login Modal -->
    <div id="login-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Login</h2>
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button id="submit-login">Login</button>
            <button id="close-login" class="close-modal" data-modal="login-modal">Cancel</button>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signup-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Sign Up</h2>
            <input type="text" id="signup-alias" placeholder="Alias" required>
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password" required>
            <input type="number" id="signup-age" placeholder="Age" min="1" required>
            <button id="submit-signup">Sign Up</button>
            <button id="close-signup" class="close-modal" data-modal="signup-modal">Cancel</button>
            <p id="signup-message" class="hidden"></p>
        </div>
    </div>

    <!-- Create Category Modal -->
    <div id="create-category-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Create a New Category</h2>
            <input type="text" id="category-name" placeholder="Category Name">
            <button id="submit-category">Create Category</button>
            <button id="close-create-category" class="close-modal" data-modal="create-category-modal">Cancel</button>
        </div>
    </div>

    <script src="scripts/user-details.js"></script>
    <script src="scripts/quiz-questions.js"></script>
    <script src="scripts/quiz-results.js"></script>
    <script src="scripts/login.js"></script>
    <script src="scripts/register.js"></script>
    <script src="scripts/categories.js"></script>
    <script src="scripts/script.js"></script>
</body>

</html>
