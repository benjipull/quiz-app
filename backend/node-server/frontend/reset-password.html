<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            width: 300px;
            margin: auto;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #218838;
        }

        .message {
            margin-top: 10px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Reset Password</h2>
        <p>Enter your new password</p>
        <input type="password" id="password" placeholder="New Password" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
        <button id="resetPasswordBtn">Reset Password</button>
        <p class="message" id="message"></p>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Extract token from URL
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get("token");

            if (!token) {
                document.getElementById("message").innerText = "Invalid or expired token.";
                document.getElementById("resetPasswordBtn").disabled = true;
                return;
            }

            document.getElementById("resetPasswordBtn").addEventListener("click", async function () {
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const messageEl = document.getElementById("message");

                if (password !== confirmPassword) {
                    messageEl.innerText = "Passwords do not match!";
                    return;
                }

                try {
                    const response = await fetch("/api/updatePassword", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ token, password })
                    });

                    const data = await response.json();
                    if (response.ok) {
                        messageEl.style.color = "green";
                        messageEl.innerText = "Password successfully updated! Redirecting...";
                        setTimeout(() => window.location.href = "/index.html", 2000);
                    } else {
                        messageEl.innerText = data.error || "Failed to update password.";
                    }
                } catch (error) {
                    messageEl.innerText = "Error connecting to server.";
                }
            });
        });
    </script>

</body>

</html>
