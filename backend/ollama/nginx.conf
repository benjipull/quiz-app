user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events { }

http {
    server {
        listen 11440;

        location / {
            proxy_pass http://127.0.0.1:11434;
            proxy_set_header Host localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # ✅ Increase Timeout Settings
            proxy_connect_timeout 10s;   # Time to establish connection with Ollama
            proxy_send_timeout 6000s;      # Time to send request to Ollama
            proxy_read_timeout 6000s;      # Time to wait for Ollama's response
            send_timeout 6000s;            # Time allowed for a complete client request
        }
    }
}
