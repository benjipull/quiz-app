steps:
  - id: Build
    name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/quiz-frontend:$SHORT_SHA', '.']
    dir: 'frontend-react'

  - id: Push
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/quiz-frontend:$SHORT_SHA']

  - id: Deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    waitFor: ['Push']
    args:
      [
        'run', 'deploy', 'quiz-frontend',
        '--image', 'gcr.io/$PROJECT_ID/quiz-frontend:$SHORT_SHA',
        '--region', 'europe-west1',
        '--platform', 'managed',
        '--allow-unauthenticated'
      ]

images:
  - 'gcr.io/$PROJECT_ID/quiz-frontend:$SHORT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY