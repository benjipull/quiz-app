version: '3.8'

services:
  ollama-container:
    build: "./backend/ollama"
    container_name: ollama-container
    ports:
      - "11434:11434"
      - "11440:11440"
    environment:
      - OLLAMA_MAX_LOADED_MODELS=1    # ✅ Keeps only 1 model loaded at a time
      - OLLAMA_KV_CACHE_TYPE=none     # ✅ Disables KV caching to save RAM
      - OLLAMA_NUM_PARALLEL=1         # ✅ Restricts parallel processing to reduce CPU/RAM load
      - OLLAMA_LOAD_TIMEOUT=60s       # ✅ Ensures models unload if idle
    networks:
      - quiz-app-network
    restart: unless-stopped

  node-container:
    build: "./backend/node-server"
    container_name: node-container
    ports:
      - "3000:3000"
    depends_on:
      - ollama-container
    networks:
      - quiz-app-network
    environment:
      - OLLAMA_HOST=http://ollama-container:11440
    restart: unless-stopped

networks:
  quiz-app-network:
    name: quiz-app-network
    driver: bridge
