services:
  ollama-llama3:
    profiles: ["ollama"]
    build: "./backend/ollama-llama3"
    container_name: ollama-llama3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "11435:11434"
    volumes:
      - ollama-llama3:/root/.ollama
    networks:
      - quiz-app-network
    restart: unless-stopped

  node-container:
    build:
      context: .
      dockerfile: ./backend/node-server/dockerfile
    container_name: node-container
    command: node --inspect=0.0.0.0:9229 index.js
    ports:
      - "3000:3000"
      - "9229:9229"
    networks:
      - quiz-app-network
    environment:
      - OLLAMA_HOST=http://ollama-llama3:11434
    restart: unless-stopped

networks:
  quiz-app-network:
    name: quiz-app-network
    driver: bridge

volumes:
  ollama-llama3:
