<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quizicle – The quiz world built by players!</title>
    <meta
      name="description"
      content="Play trivia on any topic or create your own quizzes. Be part of the game – the quiz world built by players!"
    />
    <meta name="author" content="Quizicle Team" />

    <!-- ✅ Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quizicle.app/" />
    <meta
      property="og:title"
      content="Quizicle – The quiz world built by players!"
    />
    <meta
      property="og:description"
      content="Play trivia on any topic or create your own quizzes. Be part of the game – the quiz world built by players!"
    />
    <meta
      property="og:image"
      content="https://quizicle.app/QuizicleLogo.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- ✅ Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://quizicle.app/" />
    <meta
      property="twitter:title"
      content="Quizicle – The quiz world built by players!"
    />
    <meta
      property="twitter:description"
      content="Play trivia on any topic or create your own quizzes. Be part of the game – the quiz world built by players!"
    />
    <meta
      property="twitter:image"
      content="https://quizicle.app/logoSVG.png"
    />

    <!-- ✅ Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="/assets/images/logo1.jpg"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
