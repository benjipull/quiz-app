<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quiz Results Animation (HTML + CSS)</title>
<style>
  :root{
    --bg-top:#0C0E1B;
    --bg-bottom:#0D1227;
    --card:#121832;
    --card-2:#0F1630;
    --ink:#E9EEFF;
    --muted:#98A1C0;
    --purple:#7A4DFF;
    --blue:#2EC4FF;
    --aqua:#1ED6D2;
    --good:#39D98A;
    --bad:#FF6B6B;
    --ring: 0 0 0 2px rgba(122,77,255,.3), 0 10px 30px rgba(0,0,0,.35);
    --soft: 0 4px 18px rgba(0,0,0,.35);
  }

  @media (prefers-color-scheme: dark){
    :root{ color-scheme: dark; }
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; margin:0; }
  body{
    font-family: ui-sans-serif, system-ui, Segoe UI, Roboto, Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
    color:var(--ink);
    background: radial-gradient(1200px 800px at 20% -10%, #10183B 0%, #0B0F25 35%, #070A16 70%), linear-gradient(180deg,var(--bg-top),var(--bg-bottom));
    display:flex; align-items:center; justify-content:center;
    padding:18px;
  }

  /* Page frame */
  .results{
    width:min(520px, 92vw);
    background: linear-gradient(180deg, #0e1130 0%, #0b0f25 100%);
    border-radius:22px;
    box-shadow: var(--soft);
    position:relative;
    overflow:hidden;
    padding:20px 18px 22px;
    border:1px solid rgba(148,129,255,.22);
  }

  .title{
    text-align:center;
    letter-spacing:.02em;
    font-weight:800;
    font-size:26px;
  }
  .chip{
    display:inline-flex;align-items:center;gap:8px;
    padding:6px 12px;border-radius:999px;margin:8px auto 16px;
    background: rgba(122,77,255,.12);
    border:1px solid rgba(122,77,255,.35);
    color:#BFB8FF;font-weight:600;
  }

  .row{
    display:grid; gap:16px;
    grid-template-columns:1fr 1fr;
    margin:14px 4px 20px;
  }

  .stat{
    background: linear-gradient(180deg, #0E1638 0%, #0B102C 100%);
    border:1px solid rgba(46,196,255,.18);
    border-radius:18px; padding:16px 14px;
  }
  .stat h4{ margin:2px 0 8px; font-size:12px; letter-spacing:.12em; color:var(--muted); }
  .stat .big{ font-size:40px; font-weight:900; line-height:1; }
  .correct{ color:var(--good); }
  .incorrect{ color:var(--bad); }

  /* Total XP pill */
  .xp{
    margin:10px 4px 16px;
    background: linear-gradient(90deg, rgba(122,77,255,.22), rgba(46,196,255,.18));
    border:1px solid rgba(122,77,255,.38);
    border-radius:16px; padding:14px 16px;
    display:flex;align-items:center; justify-content:space-between; gap:16px;
    box-shadow: var(--soft);
  }
  .xp .label{ color:#C5C9EC; letter-spacing:.08em; font-size:12px; }
  .xp .val{ font-weight:900; font-size:34px; color:#95E0FF; text-shadow:0 2px 12px rgba(46,196,255,.3); }
  .level{
    margin:10px 4px 0;
    background: linear-gradient(180deg, rgba(15,24,56,.6), rgba(10,16,40,.6));
    border:1px solid rgba(127,146,255,.16);
    border-radius:16px; padding:14px 16px;
    color:#C5C9EC; letter-spacing:.08em; font-size:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .level .n{ font-size:28px; font-weight:800; color:#E9EEFF; }

  /* Overlay: Points Earned */
  .points-overlay{
    position: fixed; inset:0; display:grid; place-items:center;
    pointer-events:none;
    z-index:10;
  }
  .points-card{
    background: radial-gradient(120px 90px at 30% 25%, rgba(46,196,255,.12), transparent 70%),
                linear-gradient(180deg, #101948, #0C1234);
    border:1px solid rgba(46,196,255,.35);
    border-radius:18px; padding:18px 22px;
    box-shadow: var(--ring);
    transform-origin:center;
    opacity:0; scale:.8;
    animation: popIn .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .points-title{ color:#B6D9FF; font-weight:700; letter-spacing:.12em; font-size:12px; text-align:center; }
  .points-amount{
    text-align:center; font-size:54px; font-weight:900; margin-top:6px;
    background: linear-gradient(180deg,#90E8FF,#6DCBFF 65%,#BCA6FF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 6px 26px rgba(46,196,255,.35);
  }
  .sub{ text-align:center; color:#9FB3DE; margin-top:6px; font-size:13px; }

  @keyframes popIn{
    50%{opacity:1; scale:1.04}
    100%{opacity:1; scale:1}
  }
  /* Fade away overlay a bit later */
  .points-overlay.fade{ animation: overlayOut .7s ease .8s forwards; }
  @keyframes overlayOut{
    to{ opacity:0; transform: translateY(-10px); }
  }

  /* Flying tokens */
  .token{
    --x: 0px; --y: 0px;
    position: fixed;
    width:14px; height:14px; border-radius:999px;
    background: radial-gradient(circle at 35% 35%, #FFFFFF, #A9F0FF 35%, #46CFFF 65%, #5F7CFF);
    box-shadow: 0 0 0 2px rgba(94,164,255,.35), 0 10px 25px rgba(0,0,0,.35);
    z-index:12; opacity:0;
    animation: fly 900ms cubic-bezier(.17,.67,.29,1.01) var(--delay,0ms) forwards;
  }
  @keyframes fly{
    0%{ opacity:0; transform: translate3d(var(--sx,0), var(--sy,0), 0) scale(.6); }
    8%{ opacity:1; }
    55%{ transform: translate3d(calc(var(--mx,0px)), calc(var(--my,0px)), 0) scale(1); }
    100%{ transform: translate3d(var(--x), var(--y), 0) scale(.2); opacity:0; }
  }

  /* Tiny confetti sparkle when XP updates */
  .spark{
    position:absolute; width:8px; height:8px; border-radius:2px;
    background: linear-gradient(180deg,#8AE9FF,#CBB2FF);
    opacity:0; transform: translate(-50%,-50%) scale(.6) rotate(0deg);
    animation: spark .7s ease forwards;
  }
  @keyframes spark{
    40%{ opacity:1; transform: translate(-50%,-50%) scale(1.2) rotate(40deg);}
    100%{ opacity:0; transform: translate(-50%,-90%) scale(.2) rotate(160deg);}
  }

  /* helper badges */
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    padding:10px 12px;border-radius:14px;background:#0E1433;border:1px solid rgba(171,184,255,.14);
  }
  .accuracy{
    display:flex;align-items:center;gap:10px; justify-content:center; margin:6px 0 16px;
    color:#C5C9EC;
  }
  .ring{
    --deg: 252deg;
    width:74px;height:74px;border-radius:999px;
    background:
      conic-gradient(from -90deg, var(--blue) 0 var(--deg), rgba(255,255,255,.06) var(--deg) 360deg);
    display:grid;place-items:center;
    border:1px solid rgba(148,129,255,.18);
  }
  .ring b{ font-size:18px; }
</style>
</head>
<body>

  <div class="results" id="results">
    <div class="title">MISSION COMPLETE!</div>
    <div class="chip">70s music</div>

    <div class="row">
      <div class="stat">
        <h4>RESULT</h4>
        <div style="display:flex;gap:22px;align-items:baseline">
          <div><span class="big correct">7</span><div style="color:#8ACDAA;font-weight:700">CORRECT</div></div>
          <div><span class="big incorrect">3</span><div style="color:#F7A3A3;font-weight:700">INCORRECT</div></div>
        </div>
      </div>

      <div class="stat accuracy">
        <div class="ring"><b>70%</b></div>
        <div><div style="font-weight:800; font-size:14px;">ACCURACY</div><div style="color:#9FB3DE;font-size:12px">Nice work!</div></div>
      </div>
    </div>

    <div class="xp" id="xpPill">
      <div>
        <div class="label">TOTAL XP</div>
        <div class="val" id="xpVal">1466</div>
      </div>
      <div class="badge">
        <div style="opacity:.75">CURRENT LEVEL</div>
        <div class="n" id="levelVal">2</div>
      </div>
    </div>

    <div class="level">
      <div>RATE THIS QUIZ</div>
      <div>★★★★★</div>
    </div>
  </div>

  <!-- Overlay that pops above everything -->
  <div class="points-overlay" id="pointsOverlay">
    <div class="points-card" id="pointsCard">
      <div class="points-title">POINTS EARNED</div>
      <div class="points-amount" id="earnedVal">+0</div>
      <div class="sub">Great answers!</div>
    </div>
  </div>

<script>
  // ====== CONFIGURE HERE ======
  const EARNED_POINTS = 120;   // points from this quiz
  const START_XP = 1466;       // current total
  const TOKEN_COUNT = 12;      // how many flying dots
  // ============================

  const overlay = document.getElementById('pointsOverlay');
  const earnedEl = document.getElementById('earnedVal');
  const xpValEl  = document.getElementById('xpVal');
  const xpPill   = document.getElementById('xpPill');
  const results  = document.getElementById('results');

  // initialize numbers
  xpValEl.textContent = START_XP;

  // Step 1: Count up on overlay
  let t0 = 0, duration = 900;
  const start = performance.now();
  function tick(now){
    const p = Math.min(1, (now - start) / duration);
    const val = Math.round(EARNED_POINTS * (0.4 + 0.6*(p*p))); // ease-in count
    earnedEl.textContent = `+${val}`;
    if (p < 1) requestAnimationFrame(tick);
    else afterCount();
  }
  requestAnimationFrame(tick);

  // Step 2: After count, start token flight + add to XP
  function afterCount(){
    overlay.classList.add('fade');

    // positions
    const cardRect = document.getElementById('pointsCard').getBoundingClientRect();
    const xpRect   = xpPill.getBoundingClientRect();

    // origin roughly at bottom of overlay card center
    const ox = cardRect.left + cardRect.width/2;
    const oy = cardRect.top  + cardRect.height*0.85;

    // destination at the numeric value inside XP pill
    const valRect = xpValEl.getBoundingClientRect();
    const dx = valRect.left + valRect.width - 8;
    const dy = valRect.top + 6;

    // spawn tokens
    for(let i=0;i<TOKEN_COUNT;i++){
      const token = document.createElement('div');
      token.className = 'token';

      // start scatter offsets
      const angle = (Math.PI*2) * (i/TOKEN_COUNT);
      const radius = 40 + Math.random()*30;
      const sx = Math.cos(angle)*radius;
      const sy = Math.sin(angle)*radius;

      // mid curve wobble
      const mx = (dx-ox)*0.6 + (Math.random()*80-40);
      const my = (dy-oy)*0.6 + (Math.random()*40-10);

      // final delta
      token.style.setProperty('--x', (dx-ox) + 'px');
      token.style.setProperty('--y', (dy-oy) + 'px');
      token.style.setProperty('--sx', sx+'px');
      token.style.setProperty('--sy', sy+'px');
      token.style.setProperty('--mx', mx+'px');
      token.style.setProperty('--my', my+'px');
      token.style.left = ox+'px';
      token.style.top  = oy+'px';
      token.style.setProperty('--delay', (150 + i*45) + 'ms');
      document.body.appendChild(token);

      // sparkle near destination
      token.addEventListener('animationend', () => {
        token.remove();
        sparkle(dy, dx);
      });
    }

    // count total XP up in sync with token landings
    let xp = START_XP;
    let added = 0;
    const per = Math.max(1, Math.round(EARNED_POINTS / TOKEN_COUNT));
    const stepTimer = setInterval(()=>{
      added += per;
      xp += per;
      if (added >= EARNED_POINTS){
        xp = START_XP + EARNED_POINTS;
        clearInterval(stepTimer);
      }
      xpValEl.textContent = xp;
    }, 120);
  }

  function sparkle(y, x){
    const s = document.createElement('div');
    s.className='spark';
    s.style.left = x+'px';
    s.style.top  = y+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 700);
  }

  // Optional: replay on click for testing
  results.addEventListener('click', () => location.reload());
</script>
</body>
</html>
